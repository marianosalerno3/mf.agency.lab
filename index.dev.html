  <!-- FadingVideo (crossfade rAF) -->
  <script type="text/babel">
    const FADE_MS = 500;
    const FADE_OUT_LEAD = 0.55;

    function FadingVideo({ src, className, style }) {
      const videoRef = React.useRef(null);
      const rafRef = React.useRef(null);
      const fadingOutRef = React.useRef(false);
      const restartTimeoutRef = React.useRef(null);

      React.useEffect(() => {
        const video = videoRef.current;
        if (!video) return;

        function fadeTo(target, duration) {
          if (rafRef.current) cancelAnimationFrame(rafRef.current);
          // requestAnimationFrame is paused while the page is hidden (background
          // tab / offscreen render). Jump straight to the target so the video is
          // never stuck invisible; the crossfade still animates when visible.
          if (document.hidden) { video.style.opacity = String(target); rafRef.current = null; return; }
          const start = parseFloat(video.style.opacity) || 0;
          const delta = target - start;
          const startTime = performance.now();
          function step(now) {
            const t = duration > 0 ? Math.min((now - startTime) / duration, 1) : 1;
            video.style.opacity = String(start + delta * t);
            if (t < 1) rafRef.current = requestAnimationFrame(step);
            else rafRef.current = null;
          }
          rafRef.current = requestAnimationFrame(step);
        }
        function onLoadedData() {
          video.style.opacity = "0";
          const p = video.play(); if (p && p.catch) p.catch(() => {});
          fadeTo(1, FADE_MS);
        }
        function onTimeUpdate() {
          const remaining = video.duration - video.currentTime;
          if (!fadingOutRef.current && remaining <= FADE_OUT_LEAD && remaining > 0) {
            fadingOutRef.current = true;
            fadeTo(0, FADE_MS);
          }
        }
        function onEnded() {
          video.style.opacity = "0";
          restartTimeoutRef.current = setTimeout(() => {
            video.currentTime = 0;
            const p = video.play(); if (p && p.catch) p.catch(() => {});
            fadingOutRef.current = false;
            fadeTo(1, FADE_MS);
          }, 100);
        }

        video.addEventListener("loadeddata", onLoadedData);
        video.addEventListener("timeupdate", onTimeUpdate);
        video.addEventListener("ended", onEnded);
        if (video.readyState >= 2) onLoadedData();

        return () => {
          if (rafRef.current) cancelAnimationFrame(rafRef.current);
          if (restartTimeoutRef.current) clearTimeout(restartTimeoutRef.current);
          video.removeEventListener("loadeddata", onLoadedData);
          video.removeEventListener("timeupdate", onTimeUpdate);
          video.removeEventListener("ended", onEnded);
        };
      }, [src]);

      return (
        <video ref={videoRef} className={className} style={Object.assign({ opacity: 0 }, style || {})}
          src={src} autoPlay muted playsInline loop={false} preload="auto" />
      );
    }
    window.FadingVideo = FadingVideo;
  </script>

  <!-- BlurText -->
  <script type="text/babel">
    function BlurText({ text, className }) {
      const motion = window.Motion.motion;
      const ref = React.useRef(null);
      const [inView, setInView] = React.useState(false);
      React.useEffect(() => {
        const el = ref.current; if (!el) return;
        const obs = new IntersectionObserver((entries) => {
          entries.forEach((e) => { if (e.isIntersecting) { setInView(true); obs.unobserve(e.target); } });
        }, { threshold: 0.1 });
        obs.observe(el);
        return () => obs.disconnect();
      }, []);
      const words = text.split(" ");
      return (
        <span ref={ref} className={className} style={{ display: "flex", flexWrap: "wrap", rowGap: "0.1em" }}>
          {words.map((w, i) => (
            <motion.span key={i} style={{ display: "inline-block", marginRight: "0.28em" }}
              initial={{ filter: "blur(10px)", opacity: 0, y: 50 }}
              animate={inView ? { filter: ["blur(10px)", "blur(5px)", "blur(0px)"], opacity: [0, 0.5, 1], y: [50, -5, 0] } : {}}
              transition={{ duration: 0.7, times: [0, 0.5, 1], ease: "easeOut", delay: (i * 100) / 1000 }}>
              {w}
            </motion.span>
          ))}
        </span>
      );
    }
    window.BlurText = BlurText;
  </script>

            <IconInstagram className="h-4 w-4" /> Vedi su Instagram
            <ArrowUpRight className="h-4 w-4 group-hover:translate-x-0.5 group-hover:-translate-y-0.5 transition-transform" />
          </a>
        </div>
      );

      return (
        <section id="casi-studio" className="bg-cream text-green py-24 md:py-32 px-6 md:px-12">
          <div className="max-w-6xl mx-auto">
            <div className="flex flex-wrap items-end justify-between gap-6 mb-16">
              <div>
                <p className="text-sm font-medium text-green/60 mb-4">// Casi Studio</p>
                <BlurText text="Progetti che parlano da soli."
                  className="font-heading font-bold text-4xl md:text-6xl tracking-[-0.02em] leading-[1.0] max-w-3xl" />
              </div>
              <a href="#contatti" className="inline-flex items-center gap-2 text-sm font-semibold text-green hover:opacity-70 transition-opacity">
                Vuoi essere il prossimo? <ArrowUpRight className="h-4 w-4" />
              </a>
            </div>

            <div className="flex flex-col gap-20">
              {featured.map((c, i) => (
                <motion.div key={c.title} {...reveal} transition={{ duration: 0.6, ease: "easeOut" }}
                  className="grid grid-cols-1 lg:grid-cols-2 gap-8 lg:gap-14 items-center">
                  <div className={i % 2 === 1 ? "lg:order-2" : ""}>{Info(c)}</div>
                  <div className={"grid grid-cols-3 gap-3 sm:gap-4 " + (i % 2 === 1 ? "lg:order-1" : "")}>
                    {c.videos.map((v) => (
                      <Reel key={v} src={"media/" + v + ".mp4"} poster={"media/" + v + ".jpg"} />
                    ))}
                  </div>
                </motion.div>
              ))}
            </div>

            {others.length > 0 && (
              <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mt-20">
                {others.map((c) => (
                  <motion.div key={c.title} {...reveal} transition={{ duration: 0.6, ease: "easeOut" }}
                    className="bg-creamlt border border-green/10 rounded-[1.5rem] p-7 flex flex-col">
                    <div className="flex items-center justify-between mb-6">
                      <span className="glass rounded-full inline-flex items-center gap-1.5 px-3 py-1 text-[11px] font-medium text-green/80">
                        <IconMapPin className="h-3.5 w-3.5" /> {c.place}
                      </span>
                      <IconInstagram className="h-5 w-5 text-green/70" />
                    </div>
                    <span className="text-xs font-medium text-greenlt mb-2">{c.sector}</span>
                    <h3 className="font-heading font-semibold text-3xl tracking-tight leading-none">{c.title}</h3>
                    <span className="text-sm text-green/60 font-light mt-1">{c.handle}</span>
                    <p className="text-sm text-green/70 font-light leading-relaxed mt-4 flex-1">{c.desc}</p>
                    <a href={c.href} target="_blank" rel="noopener"
                      className="group inline-flex items-center gap-1.5 text-sm font-semibold text-green mt-6 hover:opacity-70 transition-opacity">
                      Vedi su Instagram
                      <ArrowUpRight className="h-4 w-4 group-hover:translate-x-0.5 group-hover:-translate-y-0.5 transition-transform" />
                    </a>
                  </motion.div>
                ))}
              </div>
            )}

            <p className="text-xs text-green/40 mt-10">Alcuni dei brand che hanno scelto MF Agency Lab.</p>
          </div>
        </section>
      );
    }
    window.CasiStudio = CasiStudio;
  </script>

  <!-- Approccio (fascia verde compatta) -->
  <script type="text/babel">
    function Approccio() {
      const motion = window.Motion.motion;
      const steps = [
        ["01", "Ascolto", "Analizziamo brand, obiettivi e pubblico."],
        ["02", "Strategia", "Definiamo il piano di comunicazione su misura."],
        ["03", "Produzione", "Realizziamo contenuti, siti e campagne."],
        ["04", "Crescita", "Misuriamo i risultati e ottimizziamo nel tempo."],
      ];
      return (
        <section id="approccio" className="bg-green text-cream py-20 px-6 md:px-12 border-t border-cream/10">
          <div className="max-w-6xl mx-auto">
            <p className="text-sm font-medium text-cream/60 mb-10">// Il nostro approccio</p>
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
              {steps.map(([n, t, d], i) => (
                <motion.div key={n} initial={{ opacity: 0, y: 20 }} whileInView={{ opacity: 1, y: 0 }}
                  viewport={{ once: true }} transition={{ duration: 0.5, delay: i * 0.1 }}>
                  <span className="font-heading font-bold text-3xl text-cream/30">{n}</span>
                  <h4 className="font-heading font-semibold text-xl mt-2">{t}</h4>
                  <p className="text-sm text-cream/70 font-light mt-2 leading-relaxed">{d}</p>
                </motion.div>
              ))}
            </div>
          </div>
        </section>
      );
    }
    window.Approccio = Approccio;
  </script>

  <!-- Contatti + Footer -->
  <script type="text/babel">
    // Web3Forms: chiave gratuita da https://web3forms.com (usa la tua email
    // mf.agency.lab@gmail.com). Incolla qui la access key per ricevere le
    // richieste via email. Finché è vuota, il form usa il fallback mailto.
    const WEB3FORMS_ACCESS_KEY = "82ab177f-c125-40fb-8886-ce09422c54a7";

    function Contatti() {
      const { Logo, ArrowUpRight } = window;
      const SERVICES = ["Produzione Contenuti", "Sito Web", "Gestione Pubblicitaria", "Altro / Strategia"];
      const empty = { name: "", email: "", phone: "", servizio: SERVICES[0], message: "", consent: false };
      const [form, setForm] = React.useState(empty);
      const [status, setStatus] = React.useState("idle"); // idle | sending | success | error
      const upd = (k) => (e) => setForm(Object.assign({}, form, { [k]: e.target.type === "checkbox" ? e.target.checked : e.target.value }));

      // Meta Pixel: invio eventi in modo sicuro (no-op se il pixel è bloccato)
      const track = (event, params) => { if (typeof window.fbq === "function") window.fbq("track", event, params || {}); };

      const summary = () =>
        `Nome: ${form.name}\nEmail: ${form.email}\nTelefono: ${form.phone || "-"}\nServizio: ${form.servizio}\n\nMessaggio:\n${form.message}`;

      async function handleSubmit(e) {
        e.preventDefault();
        if (!form.consent) return;
        setStatus("sending");
        const configured = WEB3FORMS_ACCESS_KEY && WEB3FORMS_ACCESS_KEY.length > 10;
        if (configured) {
          try {
            const res = await fetch("https://api.web3forms.com/submit", {
              method: "POST",
              headers: { "Content-Type": "application/json", Accept: "application/json" },
              body: JSON.stringify({
                access_key: WEB3FORMS_ACCESS_KEY,
                subject: `Nuova richiesta dal sito — ${form.servizio}`,
                from_name: form.name,
                email: form.email,
                telefono: form.phone,
                servizio: form.servizio,
                message: form.message,
              }),
            });
            const data = await res.json();
            if (data.success) { setStatus("success"); setForm(empty); track("Lead", { content_name: form.servizio }); }
            else setStatus("error");
          } catch (err) { setStatus("error"); }
        } else {
          // Fallback senza backend: apre il client email con tutto precompilato
          const subject = encodeURIComponent(`Richiesta informazioni — ${form.servizio}`);
          const body = encodeURIComponent(summary());
          window.location.href = `mailto:mf.agency.lab@gmail.com?subject=${subject}&body=${body}`;
          track("Lead", { content_name: form.servizio });
          setStatus("success");
        }
      }

      function handleWhatsApp() {
        const text = encodeURIComponent(
          `Ciao MF Agency Lab! Sono ${form.name || "..."}. Vorrei informazioni su: ${form.servizio}.` +
          (form.message ? `\n\n${form.message}` : "")
        );
        track("Contact", { method: "whatsapp" });
        window.open(`https://wa.me/393487313525?text=${text}`, "_blank", "noopener");
      }

      const inputCls = "w-full bg-creamlt border border-green/15 rounded-xl px-4 py-3 text-sm text-green placeholder-green/40 outline-none focus:border-green/50 focus:ring-2 focus:ring-green/10 transition";

      return (
        <>
          <section id="contatti" className="bg-cream text-green px-6 md:px-12 pt-24 md:pt-32 pb-20">
            <div className="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-10 lg:gap-16 items-start">
              {/* Colonna intro + contatti rapidi */}
              <div>
                <p className="text-sm font-medium text-green/60 mb-4">// Contatti</p>
                <h2 className="font-heading font-bold text-4xl md:text-6xl tracking-[-0.02em] leading-[1.0]">
                  Pronto a far crescere il tuo brand?
                </h2>
                <p className="text-green/70 font-light mt-5 max-w-md leading-relaxed">
                  Compila il form per ricevere informazioni sui nostri servizi: produzione contenuti, siti web e gestione pubblicitaria. Ti rispondiamo entro 24 ore.
                </p>
                <div className="flex flex-col gap-3 mt-8">
                  <a href="https://wa.me/393487313525" target="_blank" rel="noopener" onClick={() => track("Contact", { method: "whatsapp" })} className="inline-flex items-center gap-2 text-sm font-semibold text-green hover:opacity-70 transition-opacity">
                    WhatsApp · 348 731 3525 <ArrowUpRight className="h-4 w-4" />
                  </a>
                  <a href="tel:+393487313525" className="inline-flex items-center gap-2 text-sm font-semibold text-green hover:opacity-70 transition-opacity">
                    Telefono · 348 731 3525 <ArrowUpRight className="h-4 w-4" />
                  </a>
                  <a href="mailto:mf.agency.lab@gmail.com" className="inline-flex items-center gap-2 text-sm font-semibold text-green hover:opacity-70 transition-opacity">
                    mf.agency.lab@gmail.com <ArrowUpRight className="h-4 w-4" />
                  </a>
                </div>
              </div>

              {/* Form */}
              <div className="bg-creamlt border border-green/10 rounded-[1.75rem] p-6 md:p-8">
                {status === "success" ? (
                  <div className="text-center py-12">
                    <div className="glass rounded-full inline-flex items-center justify-center mb-5" style={{ width: 56, height: 56 }}>
                      <span className="text-2xl">✓</span>
                    </div>
                    <h3 className="font-heading font-semibold text-2xl">Richiesta inviata!</h3>
                    <p className="text-sm text-green/70 font-light mt-2 max-w-xs mx-auto">Grazie, ti ricontatteremo al più presto. Per urgenze scrivici su WhatsApp.</p>
                    <button onClick={() => setStatus("idle")} className="mt-6 text-sm font-semibold text-green underline underline-offset-4">Invia un'altra richiesta</button>
                  </div>
                ) : (
                  <form onSubmit={handleSubmit} className="flex flex-col gap-4">
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                      <div>
                        <label className="block text-xs font-medium text-green/70 mb-1.5">Nome e cognome *</label>
                        <input className={inputCls} type="text" required value={form.name} onChange={upd("name")} placeholder="Mario Rossi" />
                      </div>
                      <div>
                        <label className="block text-xs font-medium text-green/70 mb-1.5">Email *</label>
                        <input className={inputCls} type="email" required value={form.email} onChange={upd("email")} placeholder="nome@email.it" />
                      </div>
                    </div>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                      <div>
                        <label className="block text-xs font-medium text-green/70 mb-1.5">Telefono</label>
                        <input className={inputCls} type="tel" value={form.phone} onChange={upd("phone")} placeholder="+39 ..." />
                      </div>
                      <div>
                        <label className="block text-xs font-medium text-green/70 mb-1.5">Servizio di interesse</label>
                        <select className={inputCls} value={form.servizio} onChange={upd("servizio")}>
                          {SERVICES.map((s) => <option key={s} value={s}>{s}</option>)}
                        </select>
                      </div>
                    </div>
                    <div>
                      <label className="block text-xs font-medium text-green/70 mb-1.5">Messaggio</label>
                      <textarea className={inputCls + " resize-none"} rows="4" value={form.message} onChange={upd("message")} placeholder="Raccontaci il tuo progetto o cosa ti serve..." />
                    </div>
                    <label className="flex items-start gap-2.5 text-xs text-green/70 font-light">
                      <input type="checkbox" required checked={form.consent} onChange={upd("consent")} className="mt-0.5 accent-green" />
                      <span>Acconsento al trattamento dei dati personali per essere ricontattato. *</span>
                    </label>

                    {status === "error" && (
                      <p className="text-xs text-red-700">Invio non riuscito. Riprova o scrivici su WhatsApp.</p>
                    )}

                    <div className="flex flex-wrap items-center gap-3 mt-1">
                      <button type="submit" disabled={status === "sending"}
                        className="inline-flex items-center gap-2 bg-green text-cream rounded-full px-6 py-3 text-sm font-semibold hover:bg-greenlt transition-colors disabled:opacity-60">
                        {status === "sending" ? "Invio..." : "Invia richiesta"} <ArrowUpRight className="h-4 w-4" />
                      </button>
                      <button type="button" onClick={handleWhatsApp}
                        className="inline-flex items-center gap-2 border border-green/25 text-green rounded-full px-6 py-3 text-sm font-semibold hover:bg-green/5 transition-colors">
                        Invia su WhatsApp
                      </button>
                    </div>
                  </form>
                )}
              </div>
            </div>
          </section>

          <footer className="bg-cream text-green px-6 md:px-12 pb-10 pt-4">
            <div className="max-w-6xl mx-auto border-t border-green/10 pt-8 flex flex-col md:flex-row items-center justify-between gap-6">
              <Logo />
              <div className="flex items-center gap-6 text-sm text-green/70">
                <a href="#servizi" className="hover:text-green transition-colors">Servizi</a>
                <a href="#casi-studio" className="hover:text-green transition-colors">Casi Studio</a>
                <a href="mailto:mf.agency.lab@gmail.com" className="hover:text-green transition-colors">mf.agency.lab@gmail.com</a>
              </div>
              <p className="text-xs text-green/50">© {new Date().getFullYear()} MF Agency Lab</p>
            </div>
          </footer>
        </>
      );
    }
    window.Contatti = Contatti;
  </script>

  <!-- App -->
  <script type="text/babel">
    function App() {
      const { Hero, Servizi, CasiStudio, Approccio, Contatti } = window;
      return (
        <div className="bg-cream">
          <Hero />
          <Servizi />
          <CasiStudio />
          <Approccio />
          <Contatti />
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
