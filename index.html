  <!-- FadingVideo (crossfade rAF) -->
  <script type="text/babel">
    const FADE_MS = 500;
    const FADE_OUT_LEAD = 0.55;

    function FadingVideo({ src, className, style }) {
      const videoRef = React.useRef(null);
      const rafRef = React.useRef(null);
      const fadingOutRef = React.useRef(false);
      const restartTimeoutRef = React.useRef(null);

      React.useEffect(() => {
        const video = videoRef.current;
        if (!video) return;

        function fadeTo(target, duration) {
          if (rafRef.current) cancelAnimationFrame(rafRef.current);
          // requestAnimationFrame is paused while the page is hidden (background
          // tab / offscreen render). Jump straight to the target so the video is
          // never stuck invisible; the crossfade still animates when visible.
          if (document.hidden) { video.style.opacity = String(target); rafRef.current = null; return; }
          const start = parseFloat(video.style.opacity) || 0;
          const delta = target - start;
          const startTime = performance.now();
          function step(now) {
            const t = duration > 0 ? Math.min((now - startTime) / duration, 1) : 1;
            video.style.opacity = String(start + delta * t);
            if (t < 1) rafRef.current = requestAnimationFrame(step);
            else rafRef.current = null;
          }
          rafRef.current = requestAnimationFrame(step);
        }
        function onLoadedData() {
          video.style.opacity = "0";
          const p = video.play(); if (p && p.catch) p.catch(() => {});
          fadeTo(1, FADE_MS);
        }
        function onTimeUpdate() {
          const remaining = video.duration - video.currentTime;
          if (!fadingOutRef.current && remaining <= FADE_OUT_LEAD && remaining > 0) {
            fadingOutRef.current = true;
            fadeTo(0, FADE_MS);
          }
        }
        function onEnded() {
          video.style.opacity = "0";
          restartTimeoutRef.current = setTimeout(() => {
            video.currentTime = 0;
            const p = video.play(); if (p && p.catch) p.catch(() => {});
            fadingOutRef.current = false;
            fadeTo(1, FADE_MS);
          }, 100);
        }

        video.addEventListener("loadeddata", onLoadedData);
        video.addEventListener("timeupdate", onTimeUpdate);
        video.addEventListener("ended", onEnded);
        if (video.readyState >= 2) onLoadedData();

        return () => {
          if (rafRef.current) cancelAnimationFrame(rafRef.current);
          if (restartTimeoutRef.current) clearTimeout(restartTimeoutRef.current);
          video.removeEventListener("loadeddata", onLoadedData);
          video.removeEventListener("timeupdate", onTimeUpdate);
          video.removeEventListener("ended", onEnded);
        };
      }, [src]);

      return (
        <video ref={videoRef} className={className} style={Object.assign({ opacity: 0 }, style || {})}
          src={src} autoPlay muted playsInline loop={false} preload="auto" />
      );
    }
    window.FadingVideo = FadingVideo;
  </script>

  <!-- BlurText -->
  <script type="text/babel">
    function BlurText({ text, className }) {
      const motion = window.Motion.motion;
      const ref = React.useRef(null);
      const [inView, setInView] = React.useState(false);
      React.useEffect(() => {
        const el = ref.current; if (!el) return;
        const obs = new IntersectionObserver((entries) => {
          entries.forEach((e) => { if (e.isIntersecting) { setInView(true); obs.unobserve(e.target); } });
        }, { threshold: 0.1 });
        obs.observe(el);
        return () => obs.disconnect();
      }, []);
      const words = text.split(" ");
      return (
        <span ref={ref} className={className} style={{ display: "flex", flexWrap: "wrap", rowGap: "0.1em" }}>
          {words.map((w, i) => (
            <motion.span key={i} style={{ display: "inline-block", marginRight: "0.28em" }}
              initial={{ filter: "blur(10px)", opacity: 0, y: 50 }}
              animate={inView ? { filter: ["blur(10px)", "blur(5px)", "blur(0px)"], opacity: [0, 0.5, 1], y: [50, -5, 0] } : {}}
              transition={{ duration: 0.7, times: [0, 0.5, 1], ease: "easeOut", delay: (i * 100) / 1000 }}>
              {w}
            </motion.span>
          ))}
        </span>
      );
    }
    window.BlurText = BlurText;
  </script>
